[project]
name = "conso-cli"
version = "0.2.0"
description = "Reverse-engineered automation CLI for the Conso AI Usage Tracker extension."
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7.0",
    "curl_cffi>=0.7.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# In-process Turnstile solver ported from waguriagentic/captcha-solver.
# See src/conso/solver/cloak/NOTICE.md before redistributing anything.
solver-cloak = ["cloakbrowser"]
# Stealth-Firefox solver: the provider with production evidence.
# playwright is pinned because camoufox's fetched browser build must match it.
solver-camoufox = ["camoufox[geoip]>=0.4.0", "playwright==1.60"]
dev = ["pytest>=8"]

[project.scripts]
conso = "conso.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
